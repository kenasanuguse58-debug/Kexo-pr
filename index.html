<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEXO PR</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c28;--border:#2a2a3d;--accent:#4ade80;--text:#e8e8f0;--text-muted:#7070a0;--user-bubble:#1e2e1e;--ai-bubble:#161625;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans Ethiopic',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);}
  .logo-icon img{width:100%;height:100%;object-fit:cover;}
  .logo-name{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:0.05em;}
  .logo-sub{font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;}
  .lang-toggle{display:flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px;}
  .lang-btn{padding:5px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-family:'Noto Sans Ethiopic',sans-serif;transition:all 0.2s;background:transparent;color:var(--text-muted);}
  .lang-btn.active{background:var(--accent);color:#0a0a0f;font-weight:700;}
  .status-bar{background:var(--surface2);padding:5px 16px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0;font-family:'DM Mono',monospace;}
  .status-dot{width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

  /* API Key Screen */
  .api-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px;}
  .api-screen .welcome-logo{width:68px;height:68px;border-radius:50%;overflow:hidden;border:3px solid var(--accent);box-shadow:0 0 20px rgba(74,222,128,0.3);margin-bottom:4px;}
  .api-screen .welcome-logo img{width:100%;height:100%;object-fit:cover;}
  .api-screen h2{font-size:20px;font-weight:700;color:var(--accent);}
  .api-screen p{font-size:13px;color:var(--text-muted);text-align:center;line-height:1.6;}
  .api-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;outline:none;}
  .api-input:focus{border-color:var(--accent);}
  .api-btn{width:100%;padding:13px;background:var(--accent);border:none;border-radius:12px;color:#0a0a0f;font-size:15px;font-weight:700;cursor:pointer;font-family:'Noto Sans Ethiopic',sans-serif;}
  .api-btn:hover{background:#22c55e;}
  .api-hint{font-size:11px;color:var(--text-muted);text-align:center;}
  .api-hint a{color:var(--accent);}

  .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;}
  .messages::-webkit-scrollbar{width:3px;}
  .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .message{display:flex;gap:8px;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .message.user{flex-direction:row-reverse;}
  .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;border:1.5px solid var(--border);margin-top:2px;}
  .avatar.ai{border-color:var(--accent);}
  .avatar.ai img{width:100%;height:100%;object-fit:cover;}
  .avatar.user{background:#2a2a3d;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .bubble{max-width:78%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.6;}
  .message.ai .bubble{background:var(--ai-bubble);border:1px solid var(--border);border-top-left-radius:4px;}
  .message.user .bubble{background:var(--user-bubble);border:1px solid #1a3a1a;border-top-right-radius:4px;}
  .bubble-meta{font-size:10px;color:var(--text-muted);margin-top:3px;font-family:'DM Mono',monospace;}
  .message.user .bubble-meta{text-align:right;}
  .typing{display:flex;gap:4px;padding:4px 0;}
  .typing span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .quick-prompts{padding:8px 12px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;border-top:1px solid var(--border);}
  .quick-prompts::-webkit-scrollbar{display:none;}
  .quick-btn{white-space:nowrap;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--text-muted);font-size:12px;cursor:pointer;font-family:'Noto Sans Ethiopic',sans-serif;transition:all 0.2s;flex-shrink:0;}
  .quick-btn:hover{border-color:var(--accent);color:var(--accent);}
  .input-area{padding:10px 12px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
  .input-row{display:flex;gap:8px;align-items:flex-end;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:9px 12px;transition:border-color 0.2s;}
  .input-row:focus-within{border-color:var(--accent);}
  #userInput{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:'Noto Sans Ethiopic',sans-serif;resize:none;max-height:100px;min-height:22px;line-height:1.5;}
  #userInput::placeholder{color:var(--text-muted);}
  .mic-btn{width:34px;height:34px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;}
  .mic-btn.recording{background:#ff4444;border-color:#ff4444;animation:micPulse 0.8s infinite;}
  @keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .send-btn{width:34px;height:34px;background:var(--accent);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#0a0a0f;font-size:15px;font-weight:bold;}
  .send-btn:disabled{background:var(--border);cursor:not-allowed;color:var(--text-muted);}
  .input-hint{font-size:10px;color:var(--text-muted);text-align:center;margin-top:5px;font-family:'DM Mono',monospace;}
  .logout-btn{font-size:11px;color:var(--text-muted);background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;}
  .logout-btn:hover{border-color:#ff4444;color:#ff4444;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon"><img id="logoImg" alt="KEXO PR"></div>
    <div><div class="logo-name">KEXO PR</div><div class="logo-sub">by KENASA NUGUSE</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="logout-btn hidden" id="logoutBtn" onclick="logout()">🔑 Key ቀይር</button>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnAm" onclick="setLang('am')">አማርኛ</button>
      <button class="lang-btn" id="btnEn" onclick="setLang('en')">English</button>
    </div>
  </div>
</div>
<div class="status-bar"><div class="status-dot"></div><span id="statusText">ዝግጁ ነኝ • Ready</span></div>

<!-- API Key Screen -->
<div class="api-screen" id="apiScreen">
  <div class="welcome-logo"><img id="apiLogoImg" alt="KEXO PR"></div>
  <h2>KEXO PR</h2>
  <p id="apiDesc">ለመጀመር Anthropic API key ያስፈልጋል።<br>Key ን አንድ ጊዜ ብቻ ታስገባለህ።</p>
  <input class="api-input" id="apiKeyInput" type="password" placeholder="sk-ant-api03-...">
  <button class="api-btn" id="apiSubmitBtn" onclick="saveKey()">▶ ጀምር • Start</button>
  <p class="api-hint">Key ከሌለህ: <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></p>
</div>

<!-- Chat Screen -->
<div class="messages hidden" id="messages"></div>
<div class="quick-prompts hidden" id="quickPrompts">
  <button class="quick-btn" onclick="sendQuick(this.textContent)">አንተ ማን ነህ?</button>
  <button class="quick-btn" onclick="sendQuick(this.textContent)">Translate to Amharic</button>
  <button class="quick-btn" onclick="sendQuick(this.textContent)">ታሪክ ጻፍልኝ</button>
  <button class="quick-btn" onclick="sendQuick(this.textContent)">Help me with code</button>
  <button class="quick-btn" onclick="sendQuick(this.textContent)">ሒሳብ እርዳኝ</button>
</div>
<div class="input-area hidden" id="inputArea">
  <div class="input-row">
    <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎤</button>
    <textarea id="userInput" rows="1" placeholder="ጥያቄህን ጻፍ ወይም 🎤 ተጫን..."></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="input-hint">🎤 ተጫን ተናገር • Press mic to speak</div>
</div>

let lang='am',loading=false,hist=[],rec=null,recording=false;
let API_KEY='';

const L={
  am:{s:'ዝግጁ ነኝ • Ready',l:'እያሰብኩ ነው...',p:'ጥያቄህን ጻፍ ወይም 🎤 ተጫን...',y:'አንተ',
      apiDesc:'ለመጀመር Anthropic API key ያስፈልጋል።\nKey ን አንድ ጊዜ ብቻ ታስገባለህ።',
      apiErr:'❌ ልክ ያልሆነ key ነው። እንደገና ሞክር።'},
  en:{s:'Ready',l:'Thinking...',p:'Type or press 🎤...',y:'You',
      apiDesc:'Enter your Anthropic API key to start.\nYou only need to enter it once.',
      apiErr:'❌ Invalid key. Please try again.'}
};

// Check saved key
window.onload=()=>{
  const saved=localStorage.getItem('kexo_key');
  if(saved){API_KEY=saved;showChat();}
};

function setLang(l){
  lang=l;
  document.getElementById('btnAm').classList.toggle('active',l==='am');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  document.getElementById('statusText').textContent=L[l].s;
  document.getElementById('apiDesc').textContent=L[l].apiDesc;
  if(document.getElementById('userInput'))
    document.getElementById('userInput').placeholder=L[l].p;
}

async function saveKey(){
  const key=document.getElementById('apiKeyInput').value.trim();
  if(!key.startsWith('sk-ant-')){
    alert(L[lang].apiErr); return;
  }
  document.getElementById('apiSubmitBtn').textContent='⏳ እየሞከርኩ ነው...';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:10,messages:[{role:'user',content:'hi'}]})
    });
    if(r.ok){
      API_KEY=key;
      localStorage.setItem('kexo_key',key);
      showChat();
    } else {
      alert(L[lang].apiErr);
      document.getElementById('apiSubmitBtn').textContent='▶ ጀምር • Start';
    }
  }catch(e){
    alert(L[lang].apiErr);
    document.getElementById('apiSubmitBtn').textContent='▶ ጀምር • Start';
  }
}

function showChat(){
  document.getElementById('apiScreen').classList.add('hidden');
  document.getElementById('messages').classList.remove('hidden');
  document.getElementById('quickPrompts').classList.remove('hidden');
  document.getElementById('inputArea').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  addWelcome();
}

function logout(){
  localStorage.removeItem('kexo_key');
  API_KEY='';
  hist=[];
  document.getElementById('messages').innerHTML='';
  document.getElementById('apiScreen').classList.remove('hidden');
  document.getElementById('messages').classList.add('hidden');
  document.getElementById('quickPrompts').classList.add('hidden');
  document.getElementById('inputArea').classList.add('hidden');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('apiKeyInput').value='';
  document.getElementById('apiSubmitBtn').textContent='▶ ጀምር • Start';
}

function addWelcome(){
  const c=document.getElementById('messages');
  c.innerHTML='<div style="text-align:center;padding:20px"><div style="width:60px;height:60px;border-radius:50%;overflow:hidden;margin:0 auto 10px;border:3px solid var(--accent);box-shadow:0 0 15px rgba(74,222,128,0.3)"><img src="'+LOGO+'" style="width:100%;height:100%;object-fit:cover"></div><div style="font-size:18px;font-weight:700;color:var(--accent)">KEXO PR</div><div style="font-size:11px;color:var(--text-muted);font-family:DM Mono,monospace;margin-bottom:6px">Created by KENASA NUGUSE</div><p style="font-size:13px;color:var(--text-muted)">ጥያቄ ጠይቅ፣ ትርጉም ጠይቅ<br>Ask anything • ማንኛውም ጥያቄ</p></div>';
}

function getTime(){return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}

function addMsg(role,text){
  const c=document.getElementById('messages');
  const w=c.querySelector('div[style]');if(w&&role==='user')w.remove();
  const u=role==='user';
  const d=document.createElement('div');d.className='message '+role;
  const av=u?'<div class="avatar user">👤</div>':'<div class="avatar ai"><img src="'+LOGO+'" alt="K"></div>';
  d.innerHTML=av+'<div><div class="bubble">'+text.replace(/\n/g,'<br>')+'</div><div class="bubble-meta">'+(u?L[lang].y:'KEXO PR')+' • '+getTime()+'</div></div>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function showTyping(){
  const c=document.getElementById('messages');
  const d=document.createElement('div');d.className='message ai';d.id='typ';
  d.innerHTML='<div class="avatar ai"><img src="'+LOGO+'" alt="K"></div><div class="bubble" style="padding:12px 14px"><div class="typing"><span></span><span></span><span></span></div></div>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function rmTyping(){const t=document.getElementById('typ');if(t)t.remove();}

function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Voice not supported');return;}
  if(!rec){
    rec=new SR();rec.continuous=false;rec.interimResults=true;
    rec.onstart=()=>{recording=true;document.getElementById('micBtn').classList.add('recording');document.getElementById('micBtn').textContent='⏹';document.getElementById('statusText').textContent=lang==='am'?'🎤 እየሰማሁ ነው...':'🎤 Listening...';};
    rec.onresult=(e)=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;document.getElementById('userInput').value=t;};
    rec.onend=()=>{recording=false;document.getElementById('micBtn').classList.remove('recording');document.getElementById('micBtn').textContent='🎤';document.getElementById('statusText').textContent=L[lang].s;const t=document.getElementById('userInput').value.trim();if(t)sendMessage();};
    rec.onerror=()=>{recording=false;document.getElementById('micBtn').classList.remove('recording');document.getElementById('micBtn').textContent='🎤';};
  }
  rec.lang=lang==='am'?'am-ET':'en-US';
  if(recording)rec.stop();else rec.start();
}

async function sendMessage(){
  if(loading)return;
  const inp=document.getElementById('userInput');
  const text=inp.value.trim();if(!text)return;
  inp.value='';inp.style.height='auto';
  addMsg('user',text);hist.push({role:'user',content:text});
  loading=true;document.getElementById('sendBtn').disabled=true;
  document.getElementById('statusText').textContent=L[lang].l;
  showTyping();
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are KEXO PR, a bilingual AI (Amharic & English) created by KENASA NUGUSE. If asked who you are: "እኔ KEXO PR ነኝ። የሰራኝ KENASA NUGUSE ነው።" Respond in the language the user writes in. Answer ANY question.',messages:hist})
    });
    const d=await r.json();
    const reply=d.content?.map(b=>b.text||'').join('')||'Error.';
    hist.push({role:'assistant',content:reply});
    rmTyping();addMsg('ai',reply);
  }catch(e){
    rmTyping();
    addMsg('ai',lang==='am'?'❌ ችግር ተፈጥሯል። Internet ያረጋግጥ።':'❌ Error. Check internet.');
  }
  loading=false;document.getElementById('sendBtn').disabled=false;
  document.getElementById('statusText').textContent=L[lang].s;
}

function sendQuick(t){document.getElementById('userInput').value=t;sendMessage();}
document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
document.getElementById('userInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});
</script>
